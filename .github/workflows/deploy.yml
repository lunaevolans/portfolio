name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve Pages URL
        id: pages
        uses: actions/configure-pages@v5

      - run: npm ci

      - name: Build
        env:
          # Works for <owner>.github.io (root), project pages (/repo/) and custom domains.
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: npm run build

      - name: Render résumé PDF from the built site
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/
        run: |
          npx playwright install --with-deps chromium
          node scripts/resume-pdf.mjs --out dist/resume.pdf

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

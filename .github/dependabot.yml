version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
      tooling:
        patterns: ['eslint*', '@eslint/*', 'typescript*', 'prettier*', 'vitest', '@playwright/test', '@axe-core/*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
